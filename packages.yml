# Run `dbt deps` to install. dbt_utils for helpers; dbt_expectations for richer
# data-quality tests (Stage 3). Pin to majors that support dbt 1.7+.
packages:
  - package: dbt-labs/dbt_utils
    version: [">=1.1.0", "<2.0.0"]
  - package: metaplane/dbt_expectations
    version: [">=0.10.0", "<0.11.0"]
