version: 2

# Stage 3 (Data Quality & Integrity) lives here as dbt tests, grouped by the OHDSI DQD
# categories: conformance, completeness, plausibility. `dbt test` is the validation run.
#
# Generic test arguments are nested under `arguments:`, which dbt 1.10+ expects; the
# top-level form still works but is deprecated.
models:
  - name: person
    description: OMOP PERSON — one row per unique patient.
    columns:
      - name: person_id
        tests: [not_null, unique]                       # conformance
      - name: gender_concept_id
        tests:
          - not_null                                    # conformance
          - accepted_values:
              arguments:
                values: [8507, 8532, 0]
      - name: year_of_birth
        tests:                                          # plausibility
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1900
                # Tracks the clock instead of a literal, so it cannot go stale.
                max_value: "{{ modules.datetime.date.today().year }}"
                row_condition: "year_of_birth is not null"   # real sources lack a birth date

  - name: condition_occurrence
    columns:
      - name: condition_occurrence_id
        tests: [not_null, unique]
      - name: person_id
        tests:
          - not_null
          - relationships:                              # conformance (FK integrity)
              arguments:
                to: ref('person')
                field: person_id
      - name: condition_concept_id
        description: >
          Completeness. Before the concept-map review every row carried one generic concept
          and unmapped rows were tolerated, so this warned. The review resolved all of them,
          so a 0 is now a defect and this fails.
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "!= 0"

  - name: measurement
    columns:
      - name: person_id
        tests:
          - relationships:
              arguments:
                to: ref('person')
                field: person_id
      - name: value_as_number
        tests:
          # Completeness: a measurement should carry a result. A receptor status is a
          # coded value, not a number, so rows that resolved to a value_as_concept_id
          # are excluded rather than counted as missing.
          - not_null:
              config:
                severity: warn
                where: "value_as_concept_id is null"

  - name: drug_exposure
    description: >
      Synthea medication dispenses. Single-source by nature: neither METABRIC nor TCGA-BRCA
      ships treatment records. RxNorm codes resolve through the vocabulary, no human mapping.
    columns:
      - name: drug_exposure_id
        tests: [not_null, unique]
      - name: person_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('person')
                field: person_id
      - name: drug_concept_id
        description: 0 means the RxNorm code is absent from the loaded vocabulary.
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "!= 0"

  - name: procedure_occurrence
    description: >
      Synthea procedures. Single-source for the same reason as drug_exposure, and the only
      place surgery, biopsy and radiotherapy appear anywhere in the cohort.
    columns:
      - name: procedure_occurrence_id
        tests: [not_null, unique]
      - name: person_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('person')
                field: person_id
      - name: procedure_concept_id
        description: 0 means the SNOMED code is absent from the loaded vocabulary.
        tests:
          - not_null

  - name: observation_period
    description: >
      The span each person was under observation. OHDSI tooling (ATLAS, Achilles, DQD) bounds
      its logic by this table, so a person without a row here is invisible to those tools.
      Synthea only: the real sources carry no calendar dates to derive a period from.
    columns:
      - name: observation_period_id
        tests: [not_null, unique]
      - name: person_id
        description: One continuous period per person, so this is unique here.
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('person')
                field: person_id
      - name: observation_period_start_date
        tests:
          - not_null
      - name: observation_period_end_date
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= observation_period_start_date"
      - name: period_type_concept_id
        tests:
          - accepted_values:
              arguments:
                values: [32817]

  - name: death
    columns:
      - name: person_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('person')
                field: person_id

  - name: visit_occurrence
    columns:
      - name: visit_concept_id
        tests:
          - accepted_values:
              arguments:
                values: [9201, 9202, 9203, 0]

  - name: observation
    description: Real-source attributes (stage, grade, vital status, age) not modeled as measurements.
    columns:
      - name: observation_id
        tests: [not_null, unique]
      - name: person_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('person')
                field: person_id
      - name: observation_concept_id
        description: Every observation type carries a concept since the review; 0 is a defect.
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "!= 0"
